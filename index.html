<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clinic Expenses</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d4ed8">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#1d4ed8;--pri2:#1e40af;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--chip:#e8eefc}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#e6edf7;--mut:#94a3b8;--line:#243049;--pri:#3b82f6;--pri2:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:#1c2b4a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header b{flex:1;font-size:17px}
#pill{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2);white-space:nowrap}
main{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 4px 8px;font-size:12px}
nav button span{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
input.amt{font-size:30px;font-weight:700;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:9px 13px;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
button.b{width:100%;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:17px;font-weight:600;padding:14px;margin-top:14px}
button.b.s{background:var(--chip);color:var(--ink);font-weight:500;font-size:15px;margin-top:8px}
button.b.d{background:none;color:var(--bad);border:1px solid var(--bad);font-size:15px;margin-top:8px}
button.b:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.row .t small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-weight:700;white-space:nowrap}
.dh{font-size:12px;color:var(--mut);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
.mut{color:var(--mut);font-size:13px}
.tot{font-size:28px;font-weight:800}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--pri)}
.sub{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);padding:2px 0 2px 12px}
.ban{background:#fef3c7;color:#78350f;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
@media(prefers-color-scheme:dark){.ban{background:#3b2f0b;color:#fde68a}}
.ban.e{background:#fee2e2;color:#7f1d1d}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#0f172a;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;opacity:0;transition:opacity .18s}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}
#lock{position:fixed;inset:0;background:var(--pri);color:#fff;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center}
#lock input{max-width:200px;text-align:center;font-size:28px;letter-spacing:.4em;margin:16px 0 8px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}
#lock button{background:#fff;color:var(--pri2);border:0;border-radius:12px;padding:12px 28px;font-size:17px;font-weight:600;margin-top:8px}
#lock .lk{background:none;color:#fff;font-size:13px;text-decoration:underline;font-weight:400}
footer{text-align:center;color:var(--mut);font-size:12px;margin:18px 0}
</style></head><body>
<header><b>Clinic Expenses</b><span id="pill"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="lock"><div style="font-size:44px">&#128274;</div><h2 style="font-size:20px">Clinic Expenses</h2><div id="lockmsg">Enter your PIN</div><input id="lockpin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button onclick="tryPin()">Unlock</button><button class="lk" onclick="forgotPin()">Forgot PIN</button></div>
<script>
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast("Could not save on this phone. Storage may be full or blocked.",1);return false}}};
const GROUPS=[
  {k:"sal",n:"Staff salaries",c:["Salary - Driver","Salary - Pharmacist","Salary - Lab","Salary - Radiology","Salary - Other staff"]},
  {k:"fuel",n:"Clinic car fuel",c:["Clinic car fuel"]},
  {k:"clin",n:"Clinic expenses",c:["Rent","Utilities","Maintenance and repairs","Other clinic expense"]},
  {k:"stock",n:"Inventory restocking",c:["Supplier restock"]},
  {k:"inc",n:"Income",c:["Doctor's Fees","Medicine sold"]},
  {k:"pers",n:"Personal",c:["Personal - Groceries","Personal - Fuel","Personal - Other"]}
];
const SHEET_URL="https://script.google.com/macros/s/AKfycbxNF63DVxCtm_JT7GwyVfhpDeNFFY8Uc3BeSKPeqoYzyyDhH95lfJi7zWcJcJysCjlu/exec";
const OLD_URLS=["https://script.google.com/macros/s/AKfycbwsnLE-tyYte-2sB3SMqiIkPdKJUyDEkFy6lm4P-iJZoFt49B-RxrV5jo8olXJ-2qmD/exec"];
const isExec=u=>/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[^/]+\/exec\/?$/.test(u);
const DEF={cur:"Rs",dev:"Pharmacist phone",url:SHEET_URL,key:"",pin:"",extra:{},lastSafe:"",meds:[],incomeCats:["Doctor's Fees","Medicine sold"]};
let S=Object.assign({},DEF,LS.get("ce_s",{})),E=LS.get("ce_e",[]);
if(SHEET_URL&&(!S.url||OLD_URLS.includes(S.url)))S.url=SHEET_URL;
if(!Array.isArray(S.incomeCats)||S.incomeCats.length===0)S.incomeCats=["Doctor's Fees","Medicine sold"];
if(!Array.isArray(S.meds))S.meds=[];
const save=()=>{const a=LS.set("ce_e",E),b=LS.set("ce_s",S);return a&&b};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"x"+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const groupOf=k=>GROUPS.find(g=>g.k===k)||GROUPS[2];
const incomeCats=()=>[...(S.incomeCats||["Doctor's Fees","Medicine sold"]), ...((S.extra||{}).inc||[])];
const cats=g=>g==="inc"?incomeCats():[...groupOf(g).c,...((S.extra||{})[g]||[])];
const fmt=n=>S.cur+" "+(Math.round(n*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
const live=()=>E.filter(e=>!e.del);
const pending=e=>!e.sy||e.sy<e.u;
const monthName=m=>{const[y,mo]=m.split("-");return new Date(+y,+mo-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})};
const months=()=>[...new Set(live().map(e=>e.d.slice(0,7)))].sort().reverse();
let tt=null;function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="show"+(bad?" bad":"");clearTimeout(tt);tt=setTimeout(()=>t.className="",bad?4000:2200)}
let view="add",editing=null,fm={g:"clin",c:"",a:"",d:"",w:"",n:"",med:"",qty:1,adj:""},fMonth="",sMonth="",syncing=false,syncErr="";
const TABS=[["add","&#10133;","Add"],["list","&#128196;","Entries"],["sum","&#128202;","Summary"],["set","&#9881;&#65039;","Settings"]];
function go(v){view=v;draw();window.scrollTo(0,0)}
function draw(){
 $("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]===view?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
 $("#main").innerHTML=banner()+({add:addView,list:listView,sum:sumView,set:setView}[view])()+`<footer>By Dr. Owais Nawaz Khan</footer>`;hdr();
}
function banner(){
 if(!E.length)return"";
 const age=S.lastSafe?(Date.now()-new Date(S.lastSafe))/864e5:99;
 if(!S.url&&age>3)return`<div class="ban e">Your entries are saved only on this phone. Ask the doctor to set up the Google Sheet (Settings), or tap Settings and "Save a backup file".</div>`;
 if(S.url&&syncErr&&E.some(pending)&&age>2)return`<div class="ban">Some entries have not reached the Google Sheet yet. They are safe on this phone and will be sent when the internet is available.</div>`;
 return"";
}
function hdr(){const n=E.filter(pending).length,p=$("#pill");p.textContent=!S.url||!S.key?"Not syncing":syncing?"Sending...":syncErr?"Not sent":n?n+" to send":"Synced ✓"}

function addView(){
 if(!fm.d)fm.d=today();
 if(!cats(fm.g).includes(fm.c))fm.c=cats(fm.g)[0];
 const names=[...new Set(E.map(e=>e.w).filter(Boolean))];
 const medOptions=(S.meds||[]).map(m=>`<option value="${esc(m.name)}" data-cost="${m.cost}" data-sell="${m.sell}">${esc(m.name)} (C:${m.cost} S:${m.sell})</option>`).join("");
 const medBlock = (fm.g === "inc" && fm.c === "Medicine sold") ? `
   <label>Medicine</label><select id="medsel" onchange="onMedChange()"><option value="">Choose medicine</option>${medOptions}</select>
   <label>Quantity</label><input id="medqty" type="number" min="1" value="${fm.qty||1}" oninput="onMedChange()">
   <label>Price adjustment (add or subtract per unit)</label><input id="medadj" inputmode="decimal" value="${esc(fm.adj)}" oninput="onMedChange()">
 ` : "";
 return`<div class="card"><h2>${editing?"Edit entry":"New entry"}</h2>
 <label>Amount (${esc(S.cur)})</label><input class="amt" id="fa" inputmode="decimal" placeholder="0" value="${esc(fm.a)}" oninput="fm.a=this.value">
 <label>Type</label><div class="chips">${GROUPS.map(g=>`<button class="chip ${g.k===fm.g?"on":""}" onclick="setG('${g.k}')">${esc(g.n)}</button>`).join("")}</div>
 <label>Category</label><select id="fc" onchange="fm.c=this.value;draw()">${cats(fm.g).map(c=>`<option ${c===fm.c?"selected":""}>${esc(c)}</option>`).join("")}</select>
 <label>${fm.g==="stock"?"Supplier or shop":(fm.g==="inc"?"Received from":"Paid to or taken by")}</label><input id="fw" list="names" value="${esc(fm.w)}" oninput="fm.w=this.value" autocomplete="off"><datalist id="names">${names.map(n=>`<option>${esc(n)}</option>`).join("")}</datalist>
 ${medBlock}
 <label>Note (optional)</label><input id="fn" value="${esc(fm.n)}" oninput="fm.n=this.value" placeholder="Optional note">
 <label>Date</label><input type="date" id="fd" value="${esc(fm.d)}" onchange="fm.d=this.value">
 <button class="b" id="savebtn" onclick="saveEntry()">${editing?"Save changes":"Save"}</button>
 ${editing?`<button class="b s" onclick="cancelEdit()">Cancel</button><button class="b d" onclick="delEntry()">Delete this entry</button>`:""}</div>`}
function setG(g){fm.g=g;fm.c="";fm.med="";fm.qty=1;fm.adj="";draw()}
function resetForm(){fm={g:fm.g,c:"",a:"",d:today(),w:"",n:"",med:"",qty:1,adj:""};editing=null}
function onMedChange(){
 const sel=$("#medsel"); if(!sel || !sel.value) return;
 const med=(S.meds||[]).find(m=>m.name===sel.value); if(!med) return;
 const qty=parseFloat($("#medqty").value)||1;
 const adj=parseFloat($("#medadj").value)||0;
 const amount=(parseFloat(med.sell)||0 + adj) * qty;
 fm.a=String(Math.round(amount*100)/100);
 fm.med=med.name; fm.qty=qty; fm.adj=String(adj);
 const info=`medicine:${med.name};qty:${qty};cost:${med.cost};sell:${med.sell};adj:${adj}`;
 if(!fm.n.includes("medicine:")) fm.n = (fm.n ? fm.n + " " : "") + info;
 draw();
}
function saveEntry(){
 const a=parseFloat(String(fm.a).replace(/,/g,""));
 if(!(a>0)){toast("Enter an amount greater than zero.",1);return}
 if(!fm.d){toast("Choose a date.",1);return}
 const now=new Date().toISOString();
 let f={d:fm.d,a,g:fm.g,c:fm.c,w:fm.w.trim(),n:fm.n.trim(),u:now};
 if(fm.g==='inc' && fm.c==='Medicine sold') {
   const med=(S.meds||[]).find(m=>m.name===fm.med || m.name===$("#medsel")?.value);
   if(med){
     const qty=fm.qty||parseFloat($("#medqty")?.value)||1; const adj=parseFloat(fm.adj||$("#medadj")?.value||0)||0;
     const info=`medicine:${med.name};qty:${qty};cost:${med.cost};sell:${med.sell};adj:${adj}`;
     if(!f.n.includes("medicine:")) f.n=(f.n?f.n+" ":"")+info;
   }
 }
 if(editing){const e=E.find(x=>x.id===editing);if(e)Object.assign(e,f)}else E.push({id:uid(),del:false,sy:"",cr:now,...f});
 if(!save())return;const was=editing;resetForm();toast(was?"Changes saved.":"Saved ✓");kickSync();if(was)view="list";draw();
 if(fm.g==='inc' && fm.c==='Medicine sold' && !editing){
   const med=(S.meds||[]).find(m=>m.name===f.w || m.name===$("#medsel")?.value);
 }
}
function editEntry(id){const e=E.find(x=>x.id===id);if(!e)return;editing=id;fm={g:e.g,c:e.c,a:String(e.a),d:e.d,w:e.w,n:e.n,med:"",qty:1,adj:""};view="add";draw();window.scrollTo(0,0)}
function cancelEdit(){resetForm();view="list";draw()}
function delEntry(){if(!confirm("Delete this entry? It will be removed from the list and from the Google Sheet totals."))return;const e=E.find(x=>x.id===editing);if(e){e.del=true;e.u=new Date().toISOString()}save();resetForm();toast("Deleted.");kickSync();view="list";draw()}
function listView(){
 const ms=months(),m=ms.includes(fMonth)||fMonth==="all"?fMonth:(ms[0]||"all");fMonth=m;
 const rows=live().filter(e=>m==="all"||e.d.slice(0,7)===m).sort((a,b)=>b.d.localeCompare(a.d)||b.cr.localeCompare(a.cr));
 const tot=rows.reduce((s,e)=>s+e.a,0);let last="",h="";
 rows.forEach(e=>{if(e.d!==last){last=e.d;h+=`<div class="dh">${new Date(e.d+"T00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</div>`}
  h+=`<div class="row" onclick="editEntry('${e.id}')"><div class="t">${esc(e.c)}<small>${esc([e.w,e.n].filter(Boolean).join(" · "))||"&nbsp;"}</small></div><div class="m">${fmt(e.a)}</div></div>`});
 return`<div class="card"><h2>Entries</h2><select onchange="fMonth=this.value;draw()"><option value="all" ${m==="all"?"selected":""}>All months</option>${ms.map(x=>`<option value="${x}" ${x===m?"selected":""}>${monthName(x)}</option>`).join("")}</select>
 <div class="mut" style="margin-top:10px">Total shown</div><div class="tot">${fmt(tot)}</div></div>
 <div class="card">${h||`<p class="mut">No entries yet. Tap Add to record the first one.</p>`}</div>
 ${rows.length?`<p class="mut" style="text-align:center">Tap an entry to edit or delete it.</p>`:""}`}

function sumView(){
 const ms=months(),m=ms.includes(sMonth)?sMonth:(ms[0]||"");sMonth=m;
 if(!m)return`<div class="card"><h2>Summary</h2><p class="mut">Nothing to summarise yet.</p></div>`;
 const rows=live().filter(e=>e.d.slice(0,7)===m);
 const expenses=rows.filter(e=>e.g!=='inc');
 const income=rows.filter(e=>e.g==='inc');
 const expTotal=expenses.reduce((s,e)=>s+e.a,0);
 const incTotal=income.reduce((s,e)=>s+e.a,0);
 const net=incTotal-expTotal;
 const byG=GROUPS.map(g=>{const r=rows.filter(e=>e.g===g.k),t=r.reduce((s,e)=>s+e.a,0),c={};r.forEach(e=>c[e.c]=(c[e.c]||0)+e.a);return{g,t,c}}).filter(x=>x.t>0);
 let html=`<div class="card"><h2>Summary</h2><select onchange="sMonth=this.value;draw()">${ms.map(x=>`<option value="${x}" ${x===m?"selected":""}>${monthName(x)}</option>`).join("")}</select>
 <div class="mut" style="margin-top:10px">Income</div><div class="tot" style="color:#15803d">${fmt(incTotal)}</div>
 <div class="mut" style="margin-top:10px">Expenses</div><div class="tot" style="color:#b91c1c">${fmt(expTotal)}</div>
 <div class="mut" style="margin-top:10px">Net</div><div class="tot" style="color:${net>=0?"#15803d":"#b91c1c"}">${fmt(net)}</div></div>`;
 html+=`<div class="card">${byG.map(x=>`<div style="display:flex;justify-content:space-between"><b>${esc(x.g.n)}</b><b>${fmt(x.t)}</b></div><div style="margin-top:8px">`+
   Object.keys(x.c).map(k=>`<div style="display:flex;justify-content:space-between"><div>${esc(k)}</div><div>${fmt(x.c[k])}</div></div>`).join("")+`</div>`).join("")}</div>`;
 const persRows=rows.filter(e=>e.g==='pers');
 if(persRows.length){
   const byWho={};persRows.forEach(e=>{const who=e.w||'Unknown';byWho[who]=(byWho[who]||0)+e.a});
   html+=`<div class="card"><h2>Personal — by recipient</h2>${Object.keys(byWho).map(k=>`<div style="display:flex;justify-content:space-between"><div>${esc(k)}</div><div>${fmt(byWho[k])}</div></div>`).join("")}</div>`;
 }
 const incomeMedRows=rows.filter(e=>e.g==='inc' && e.c==='Medicine sold');
 if(incomeMedRows.length){
   const medAgg={};
   incomeMedRows.forEach(e=>{
     const note=e.n||""; const m=(note.match(/medicine:([^;\s]+)/)||[])[1]; const qty=parseFloat((note.match(/qty:([0-9.]+)/)||[])[1])||1; const cost=parseFloat((note.match(/cost:([0-9.]+)/)||[])[1])||0; const sell=parseFloat((note.match(/sell:([0-9.]+)/)||[])[1])||0;
     if(m){medAgg[m]=medAgg[m]||{qty:0,cost:0,sell:0,amount:0}; medAgg[m].qty+=qty; medAgg[m].cost+=cost*qty; medAgg[m].sell+=sell*qty; medAgg[m].amount+=e.a}
   });
   if(Object.keys(medAgg).length){
     html+=`<div class="card"><h2>Medicines sold</h2>${Object.keys(medAgg).map(m=>`<div style="display:flex;justify-content:space-between"><div>${esc(m)} · ${medAgg[m].qty} units</div><div>${fmt(medAgg[m].amount)}</div></div>`).join("")}</div>`;
   }
 }
 if((S.meds||[]).length){
   const lowStock=(S.meds||[]).filter(m=>(Number(m.stock)||0)<=5).map(m=>`${m.name}: ${Number(m.stock)||0}`);
   if(lowStock.length){ html += `<div class="card"><h2>Low stock</h2>${lowStock.map(x=>`<div class="mut">${esc(x)}</div>`).join("")}</div>`; }
 }
 return html;
}

function setView(){
 const n=E.filter(pending).length;
 return`<div class="card"><h2>Google Sheet (automatic copy for the doctor)</h2>
 <p class="mut">${S.url?(syncErr?"Could not reach the sheet: "+esc(syncErr)+". Entries stay safe here and are sent later.":n?n+" entries waiting to be sent.":"Everything has been sent."):"Not set"}</p>
 <label>Sheet link</label><input id="su" value="${esc(S.url)}" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off" autocorrect="off">
 <label>Key</label><input id="sk" value="${esc(S.key)}" autocapitalize="off" autocorrect="off">
 <label>This phone's name</label><input id="sd" value="${esc(S.dev)}">
 <button class="b" onclick="saveSync()">Save and test</button><button class="b s" onclick="syncAll(true)">Send waiting entries now</button></div>
 <div class="card"><h2>Income labels</h2>
 <label>Doctor / professional fee label</label><input id="incDoc" value="${esc((S.incomeCats||["Doctor's Fees","Medicine sold"])[0]||"Doctor's Fees")}">
 <label>Medicine sold label</label><input id="incMed" value="${esc((S.incomeCats||["Doctor's Fees","Medicine sold"])[1]||"Medicine sold")}">
 <button class="b s" onclick="saveIncomeLabels()">Save income labels</button>
 <label>Add another income category</label><input id="newInc" placeholder="Consultation charges">
 <button class="b s" onclick="addIncomeCat()">Add income category</button></div>
 <div class="card"><h2>Medicines (for "Medicine sold")</h2>
 <p class="mut">Add medicines with cost, sell price, and current stock. Selling medicine reduces stock automatically.</p>
 <div id="medlist">${(S.meds||[]).length?(S.meds||[]).map((m,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0"><div><b>${esc(m.name)}</b><div class="mut">Cost: ${m.cost} · Sell: ${m.sell} · Stock: ${Number(m.stock)||0}</div></div><div><button class="b s" onclick="editMed(${i})">Edit</button> <button class="b d" onclick="deleteMed(${i})">Delete</button></div></div>`).join(""):`<p class="mut">No medicines added yet.</p>`}</div>
 <label>Medicine name</label><input id="mn">
 <label>Cost price</label><input id="mc" inputmode="decimal">
 <label>Sell price</label><input id="ms" inputmode="decimal">
 <label>Stock on hand</label><input id="mst" type="number" min="0" value="0">
 <button class="b s" onclick="addMed()">Add / Update medicine</button></div>
 <div class="card"><h2>Backup on this phone</h2><p class="mut">Use Share to save a copy to Files, Google Drive, WhatsApp or email.</p>
 <button class="b s" onclick="exportCsv()">Share expenses spreadsheet (CSV)</button><button class="b s" onclick="exportJson()">Save a backup file</button>
 <label style="margin-top:14px">Restore from a backup file</label><input type="file" accept=".json,application/json" onchange="restore(this)"></div>
 <div class="card"><h2>PIN lock</h2><p class="mut">${S.pin?"A PIN is set. The app locks after 5 minutes away. This stops casual snooping; it is not bank-level security.":"No PIN set."}</p>
 <label>New PIN (4 to 8 digits)</label><input id="np" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
 <button class="b s" onclick="setPin()">${S.pin?"Change PIN":"Set PIN"}</button>${S.pin?`<button class="b d" onclick="removePin()">Remove PIN</button>`:""}</div>
 <div class="card"><h2>Other</h2><label>Currency label</label><input id="cu" value="${esc(S.cur)}" onchange="S.cur=this.value.trim()||'Rs';save();toast('Saved')">
 <label>Add your own category</label><select id="xg">${GROUPS.map(g=>`<option value="${g.k}">${esc(g.n)}</option>`).join("")}</select><input id="xc" placeholder="Category name" style="margin-top:8px">
 <button class="b s" onclick="addCat()">Add category</button></div>`}
function saveIncomeLabels(){
 const doc=$("#incDoc").value.trim()||"Doctor's Fees";
 const med=$("#incMed").value.trim()||"Medicine sold";
 S.incomeCats=[doc,med];
 if(!S.extra)S.extra={};
 S.extra.inc=(S.extra.inc||[]).filter(x=>!['Doctor\'s Fees','Medicine sold'].includes(x));
 save();toast("Income labels saved.");draw();
}
function addIncomeCat(){
 const val=$("#newInc").value.trim();
 if(!val)return toast("Enter an income category name.",1);
 if(incomeCats().includes(val))return toast("That income category already exists.",1);
 (S.extra.inc=S.extra.inc||[]).push(val);save();$("#newInc").value='';toast("Income category added.");draw();
}
function addCat(){const g=$("#xg").value,c=$("#xc").value.trim();if(!c)return;if(cats(g).includes(c)){toast("That category already exists.",1);return}(S.extra[g]=S.extra[g]||[]).push(c);save();toast("Category added.");draw()}
function addMed(){
 const name=$("#mn").value.trim();
 const cost=parseFloat($("#mc").value)||0;
 const sell=parseFloat($("#ms").value)||0;
 const stock=parseInt($("#mst").value,10)||0;
 if(!name){toast("Enter a medicine name.",1);return}
 const list=(S.meds||[]);
 const idx=list.findIndex(m=>m.name.toLowerCase()===name.toLowerCase());
 if(idx>=0){list[idx]={name,cost,sell,stock};}
 else{list.push({name,cost,sell,stock});}
 S.meds=list; save();toast("Medicine saved.");draw();$("#mn").value=$("#mc").value=$("#ms").value=$("#mst").value="";
}
function editMed(i){const m=(S.meds||[])[i];if(!m)return;$("#mn").value=m.name;$("#mc").value=m.cost;$("#ms").value=m.sell;$("#mst").value=(m.stock||0);S.meds.splice(i,1);save();draw()}
function deleteMed(i){if(!confirm("Delete this medicine?"))return;const list=(S.meds||[]);list.splice(i,1);S.meds=list;save();toast("Deleted.");draw()}

const rowOf=e=>({id:e.id,d:e.d,a:e.a,g:e.g,gn:groupOf(e.g).n,c:e.c,w:e.w,n:e.n,del:!!e.del,u:e.u,dev:S.dev});
async function getJSON(url){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),20000);try{const r=await fetch(url,{signal:ac.signal});return await r.json()}finally{clearTimeout(t)}}
const join=(u,q)=>u+(u.includes("?")?"&":"?")+q;
async function syncAll(manual){if(!S.url||!S.key){if(manual)toast("Add the sheet link and key first.",1);return}if(syncing)return;syncing=true;syncErr="";hdr();try{for(const e of E.filter(pending)){const u=e.u,r=await getJSON(join(S.url,"op=upsert&key="+encodeURIComponent(S.key)+"&d="+encodeURIComponent(JSON.stringify(rowOf(e)))));if(!r||!r.ok)throw new Error((r&&r.err)||"The sheet refused the entry");e.sy=u;save()}S.lastSafe=new Date().toISOString();save();if(manual)toast("Everything sent ✓");}catch(x){syncErr=x.name==="AbortError"?"timed out":(x.message==="Failed to fetch"||x.name==="TypeError"?"no internet":x.message);if(manual)toast("Not sent: "+syncErr,1)}syncing=false;hdr();if(view==="list")draw()}
let kt=null;function kickSync(){clearTimeout(kt);kt=setTimeout(()=>syncAll(false),800)}
async function saveSync(){S.url=$("#su").value.trim();S.key=$("#sk").value.trim();S.dev=$("#sd").value.trim()||"Pharmacist phone";save();if(!S.url||!S.key){toast("Sync turned off.");draw();return}if(!isExec(S.url)){toast("That is not a Web app link. Use the link from Deploy > New deployment > Web app (it ends in /exec).",1);draw();return}try{const r=await getJSON(join(S.url,"op=ping&key="+encodeURIComponent(S.key)));if(r&&r.ok){syncErr="";toast("Connected ✓");syncAll(false)}else toast("Connected, but the key is wrong.",1)}catch(e){syncErr="could not reach the sheet";toast("Could not reach the sheet. If the internet works, the doctor needs to re-deploy the Google script (Manage deployments > New version).",1)}draw()}
async function shareFile(name,text,type){const f=new File([text],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return true}catch(e){if(e.name==="AbortError")return false}}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();return true}
const q=x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"';
function csvText(){return"﻿"+[[("Date","Group","Category","Paid to / taken by","Note","Amount")]].concat(live().sort((a,b)=>a.d.localeCompare(b.d)).map(e=>[e.d,groupOf(e.g).n,e.c,e.w,e.n,e.a])).map(r=>r.map(q).join(",")).join("\n")} 
async function exportCsv(){if(await shareFile("expenses-"+today()+".csv",csvText(),"text/csv")){S.lastSafe=new Date().toISOString();save()}}
async function exportJson(){if(await shareFile("expenses-backup-"+today()+".json",JSON.stringify({v:1,entries:E,settings:{...S,pin:""}}),"application/json")){S.lastSafe=new Date().toISOString();save()}}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||!Array.isArray(j.entries))throw 0;let n=0;j.entries.forEach(x=>{if(!x||!x.id||!x.d||!(x.a>=0))return;const c=E.find(e=>e.id===x.id);if(!c){E.push(x);n++}else if(String(x.u)>String(c.u)){Object.assign(c,x);n++}});save();toast(n+" entries restored.");draw()}catch(e){toast("That is not a valid backup file.",1)}};r.readAsText(f)}
async function hashPin(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ce|"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return""}}
async function setPin(){const p=$("#np").value.trim();if(!/^\d{4,8}$/.test(p)){toast("Use 4 to 8 digits.",1);return}S.pin=await hashPin(p);save();toast("PIN saved.");draw()}
function removePin(){if(confirm("Remove the PIN lock?")){S.pin="";save();draw()}}
function lock(){if(!S.pin)return;$("#lock").style.display="flex";$("#lockpin").value="";$("#lockmsg").textContent="Enter your PIN"}
async function tryPin(){const h=await hashPin($("#lockpin").value);if(h===S.pin){$("#lock").style.display="none"}else{$("#lockmsg").textContent="Wrong PIN, try again";$("#lockpin").value=""}}
function forgotPin(){if(confirm("Forgot PIN? The only way in is to erase everything saved on this phone. Entries already sent to the Google Sheet are NOT lost, but entries not yet sent would be. Continue?")){E=[];S={...DEF};save();draw();toast("App data cleared.")}}
let hiddenAt=0;
document.addEventListener("keydown",e=>{if(e.key==="Enter" && document.activeElement && document.activeElement.id==="lockpin") tryPin()});
document.addEventListener("visibilitychange",()=>{if(document.hidden){hiddenAt=Date.now()}else{if(S.pin&&hiddenAt&&Date.now()-hiddenAt>5*60e3)lock();kickSync()}});
window.addEventListener("online",kickSync);setInterval(()=>{if(navigator.onLine)syncAll(false)},60000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
lock();draw();kickSync();
</script></body></html>
